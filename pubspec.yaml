name: scriptoria
description: A new Flutter project.

publish_to: 'none'

version: 0.12.0+11

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.0.7
  permission_handler: ^11.0.1
  supabase_flutter: ^2.0.0
  shared_preferences: ^2.2.0
  flutter_dotenv: ^5.1.0
  provider: ^6.1.2
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  firebase_performance: ^0.11.4+6
  flutter_markdown_plus: ^1.0.7
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

# Icône de lancement de l'app, générée depuis le logo déjà affiché dans
# l'en-tête de l'accueil : l'icône du téléphone et celle de l'écran d'accueil
# sont ainsi la même image.
# Régénérer après modification du logo : dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: "launcher_icon"
  # Android 6.0 minimum depuis l'ajout de firebase_performance.
  min_sdk_android: 23
  ios: false
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#161622"
    theme_color: "#6FE3E1"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - .env
